services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-DK_BLOG}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - docker-base_default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18
    container_name: DK_BLOG_DB
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BLOG_DB_USER}
      POSTGRES_PASSWORD: ${BLOG_DB_PASSWORD}
      POSTGRES_DB: ${BLOG_DB_NAME}
    volumes:
      - blog_db_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - docker-base_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BLOG_DB_USER} -d ${BLOG_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: DK_BLOG_API
    restart: unless-stopped
    environment:
      BLOG_DB_HOST: db
      BLOG_DB_PORT: 5432
      BLOG_DB_USER: ${BLOG_DB_USER}
      BLOG_DB_PASSWORD: ${BLOG_DB_PASSWORD}
      BLOG_DB_NAME: ${BLOG_DB_NAME}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - docker-base_default
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  docker-base_default:
    external: true

volumes:
  blog_db_data:
