# Bots de preview de link (WhatsApp, Telegram, Twitter, Facebook, LinkedIn,
# Slack, Discord) e crawlers de busca não executam JS, então não veem o
# meta tag que a SPA seta em runtime (src/lib/seo.js) — só a API consegue
# devolver HTML com o meta tag certo por post (ver /prerender/posts/:slug
# em api/server.js). Visitante humano normal nunca bate nesse map (UA de
# navegador não casa com nenhum padrão abaixo) e continua na SPA de sempre.
map $http_user_agent $is_link_preview_bot {
    default 0;
    "~*facebookexternalhit|Facebot|Twitterbot|WhatsApp|TelegramBot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview|Googlebot|bingbot|Applebot" 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # DNS do Docker Compose — resolução em runtime (não só no start do
    # nginx) pra sobreviver a um restart do container da API com IP novo.
    resolver 127.0.0.11 valid=30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/rss+xml image/svg+xml;

    # A API já usa helmet (api/server.js), mas isso só cobre respostas da
    # API — quem serve o HTML/JS/CSS que o navegador realmente carrega é
    # este nginx. Sem CSP de propósito: SPA com JSON-LD inline
    # (src/lib/seo.js) e fontes do Google Fonts tornariam uma CSP segura
    # não-trivial de acertar sem quebrar algo; os headers abaixo cobrem o
    # ganho de baixo risco sem essa complexidade.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location ~ ^/posts/([^/]+)/?$ {
        # $1 precisa virar variável própria ANTES do if — o if referencia
        # $is_link_preview_bot (map), e a avaliação de regex do map reseta
        # os grupos de captura $1..$9 da location se lidos depois (pitfall
        # clássico do nginx).
        set $slug $1;
        if ($is_link_preview_bot) {
            set $prerender_upstream http://api:3000;
            proxy_pass $prerender_upstream/prerender/posts/$slug;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback — todas as outras rotas servem index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx não herda add_header do server block numa location que já
    # declara o seu próprio add_header — por isso os 4 headers de
    # segurança acima precisam ser repetidos aqui.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }
}
